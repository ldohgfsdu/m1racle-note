name: Windows build evidence - release not accepted

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'editor/**'
      - 'package*.json'
      - '.github/workflows/windows-candidate.yml'

permissions:
  contents: read

jobs:
  build-evidence:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the official Electron runtime used by hidden tests
        run: node node_modules/electron/install.js
      - name: Build and inspect the portable application
        shell: pwsh
        run: |
          node desktop/scripts/windows-package.mjs --use-existing-icons
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Get-Content desktop/scripts/windows-package.mjs -Raw
          $version = [regex]::Match($source, "export const version='(\d+\.\d+\.\d+)'").Groups[1].Value
          node desktop/scripts/windows-verify-package.mjs $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned NSIS compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path tools/windows-installer -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'note-nsis-3.11.zip'
          Invoke-WebRequest 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1') { throw 'NSIS archive integrity mismatch' }
          Expand-Archive $archive tools/windows-installer
      - name: Build installer and export uninstaller for signing
        run: node desktop/scripts/windows-installer.mjs --export-uninstaller desktop/releases/signing/Uninstall.exe
      - name: Record actual signatures and source revision
        id: signature-evidence
        run: node desktop/scripts/windows-candidate-evidence.mjs
      - name: Exercise onboarding in the existing hidden Electron harness
        run: npm run verify:targeted -- --only desktop-onboarding
        env:
          NOTE_QA_OUTPUT: ${{ runner.temp }}/note-onboarding-evidence
      - name: Retain build evidence; these files are not an accepted release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-development-evidence-NOT-A-SIGNED-RELEASE
          retention-days: 14
          if-no-files-found: warn
          path: |
            desktop/releases/windows-installer/
            desktop/releases/signing/
            desktop/releases/candidate-evidence/
            ${{ runner.temp }}/note-onboarding-evidence/
      - name: Signature gate - intentionally blocked while binaries are unsigned
        if: always() && steps.signature-evidence.outcome == 'success'
        run: node desktop/scripts/windows-candidate-evidence.mjs --require-trusted
        env:
          NOTE_EXPECTED_SIGNER_SUBJECT: ${{ vars.NOTE_EXPECTED_SIGNER_SUBJECT }}
